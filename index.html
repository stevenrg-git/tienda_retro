<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Video Retro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: fixed 1300x726 arcade stage, scaled to the viewport; every element sits at the coordinates of the reference image. */
:root{
  color-scheme:dark;
  --night:#44124f;
  --field:#4c1555;
  --frame:#7a2272;
  --panel:#a52a72;
  --buy:#6a1a5e;
  --btn:#0b1180;
  --neon:#ff4fc0;
  --cyan:#59f0ff;
  --ink:#14061c;
  --grass:#33b535;
  --dirt:#9c4a14;
  --f-title:'Silkscreen','Courier New',monospace;
  --f-ui:'Pixelify Sans','Courier New',monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--night);color:#fff;font-family:var(--f-ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px}
.fit{position:relative;width:100%;max-width:1560px;margin:0 auto;aspect-ratio:1300/726;overflow:hidden}
.stage{position:absolute;left:0;top:0;width:1300px;height:726px;transform-origin:0 0;overflow:hidden;background:var(--night);user-select:none;-webkit-user-select:none}
.abs{position:absolute}
button{font:inherit;cursor:pointer;padding:0}
button:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}

/* scenery */
.scene{left:0;top:0;width:1300px;height:640px;clip-path:polygon(55px 0,1243px 0,1212px 640px,97px 640px)}
.sky{left:0;top:110px;width:1300px;height:530px;background:var(--field)}
.glow{left:0;top:285px;width:1300px;height:88px;background:linear-gradient(to bottom,transparent,rgba(255,70,185,.35) 55%,#ff62c8 96%,#ffc2ee 100%);animation:glowpulse 3.2s ease-in-out infinite}
#floor{left:0;top:370px;width:1300px;height:270px}
.horizon{left:0;top:369px;width:1300px;height:3px;background:#ff9ae0;box-shadow:0 0 14px 3px rgba(255,90,200,.8)}
.strip{left:0;top:0;width:1300px;height:655px}
.strip.l{background:linear-gradient(90deg,#8a2a80,#6c1d68);clip-path:polygon(10px 0,55px 0,97px 655px,62px 655px)}
.strip.r{background:linear-gradient(90deg,#6c1d68,#8a2a80);clip-path:polygon(1243px 0,1280px 0,1238px 655px,1212px 655px)}
.star{width:3px;height:3px;background:#fff;border-radius:50%;animation:twinkle 3s ease-in-out infinite}
.shoot{left:200px;top:150px;width:70px;height:2px;background:linear-gradient(90deg,transparent,#fff);transform:rotate(25deg);opacity:0;animation:shoot 9s linear infinite 3s}

/* header */
.titlebox{left:63px;top:13px;width:741px;height:82px;border-radius:12px;background:var(--panel);display:flex;align-items:center;justify-content:center;transition:box-shadow .3s,background .3s}
.titlebox:hover{background:#b8307f;box-shadow:0 0 26px rgba(255,79,192,.7)}
.title{margin:0;font-family:var(--f-title);font-weight:700;font-size:40px;letter-spacing:3px;color:var(--ink);white-space:pre;text-shadow:2px 2px 0 rgba(255,140,220,.35)}
.title span{display:inline-block;animation:wave 2.6s ease-in-out infinite;animation-delay:calc(var(--i)*.12s)}
.titlebox:hover .title span{animation:jump .55s ease-out infinite;animation-delay:calc(var(--i)*.05s);color:#fff;text-shadow:0 0 10px #ff4fc0,2px 2px 0 var(--ink)}
.pill{border:4px solid var(--panel);background:var(--btn);border-radius:44px;color:#2a2aa8;font-family:var(--f-title);font-size:17px;overflow:hidden;animation:pillglow 3s ease-in-out infinite;transition:transform .2s,background .2s,color .2s,border-color .2s}
.pill span{position:relative;z-index:1}
.pill::after{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg)}
.pill:hover{transform:translateY(-4px) scale(1.07);background:#1a26e0;color:#fff;border-color:var(--cyan);box-shadow:0 0 24px var(--neon),inset 0 0 12px rgba(255,255,255,.35);text-shadow:0 0 8px var(--cyan)}
.pill:hover::after{animation:sheen .7s ease-out}
.pill:active{transform:scale(.93)}
#login{left:827px;top:18px;width:177px;height:72px}
#signup{left:1025px;top:12px;width:186px;height:75px;animation-delay:-1.5s}

/* lights */
.lights{left:55px;top:96px;width:740px;height:44px}
.bulb{position:absolute;width:15px;height:19px;margin-left:-7px;border-radius:50% 50% 46% 46%;background:radial-gradient(circle at 35% 30%,#fff 0,var(--c) 45%,var(--c) 100%);box-shadow:0 0 12px 4px var(--c);animation:bulb 2s ease-in-out infinite;animation-delay:calc(var(--i)*-.17s)}
.bulb::before{content:"";position:absolute;left:4px;top:-4px;width:7px;height:5px;background:#2a2a34;border-radius:1px}

/* section labels */
.label{font-family:var(--f-ui);font-weight:600;font-size:25px;letter-spacing:2px;color:#fff;text-shadow:0 0 8px rgba(255,79,192,.0);animation:labelglow 3s ease-in-out infinite}
#lbl-con{left:252px;top:157px}
#lbl-jue{left:245px;top:382px;animation-delay:-1.4s}

/* consoles */
.cpanel{left:173px;top:190px;width:908px;height:170px;border-radius:28px;background:var(--panel)}
.con{width:136px;height:185px;top:190px}
.disc{position:absolute;left:5px;top:13px;width:126px;height:126px;border-radius:50%;border:2px solid var(--ink);overflow:hidden;animation:bob 3.4s ease-in-out infinite;animation-delay:calc(var(--n)*-.55s);transition:filter .2s}
.disc svg{width:100%;height:100%;display:block}
.con:hover .disc{animation:spin .8s ease-in-out;filter:brightness(1.15) saturate(1.2)}
.lab{position:absolute;left:12px;width:116px;background:#fff;color:var(--ink);border-radius:30px;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--f-ui);font-weight:600;font-size:17px;line-height:1.15;z-index:2;padding:0 8px}
.con:hover .lab{animation:pop .5s ease-out}
.wig{transform-box:fill-box;transform-origin:50% 100%;animation:wig 2.4s ease-in-out infinite}
.buy{position:absolute;left:0;top:143px;width:136px;height:39px;border:0;border-radius:22px;background:var(--buy);color:var(--ink);font-family:var(--f-ui);font-weight:600;font-size:22px;letter-spacing:1px;overflow:hidden;transition:transform .18s,background .18s,color .18s,box-shadow .18s}
.buy::after{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg)}
.buy:hover{transform:translateY(-3px) rotate(-2deg) scale(1.07);background:var(--neon);color:#fff;box-shadow:0 0 18px var(--neon)}
.buy:hover::after{animation:sheen .6s ease-out}
.buy:active{transform:scale(.92)}

/* ground */
.grass{left:173px;top:418px;width:903px;height:11px;background:
  repeating-linear-gradient(90deg,rgba(10,70,20,.55) 0 3px,transparent 3px 8px),
  linear-gradient(#5be250 0 30%,#2eae33 30% 65%,#1b7a26 65%)}
.dirt{left:173px;top:429px;width:903px;height:19px;background:
  radial-gradient(circle,#d57a2c 0 1.2px,transparent 1.6px) 0 0/9px 7px,
  radial-gradient(circle,#6a2c0a 0 1.2px,transparent 1.6px) 4px 3px/11px 8px,
  linear-gradient(#a5521a,#8a3f10)}
.tree,.flower{transform-origin:50% 100%;animation:sway 3.5s ease-in-out infinite;animation-delay:calc(var(--n)*-.6s)}
.tree svg,.flower svg{width:100%;height:100%;display:block}
.flower{animation-duration:2.6s}
.cloud{width:40px;height:16px;animation:drift 9s ease-in-out infinite alternate;animation-delay:calc(var(--n)*-2.2s)}
.cloud svg{width:100%;height:100%}
.walker{left:180px;top:396px;width:24px;height:24px;animation:walk 24s linear infinite}
.walker svg{position:absolute;left:0;top:0;width:24px;height:24px}
.walker .f1{animation:frame .5s steps(1) infinite}
.walker .f2{animation:frame .5s steps(1) infinite reverse}
.bird{left:-40px;top:128px;width:30px;height:15px;animation:fly 20s linear infinite 2s}
.bird svg{position:absolute;left:0;top:0;width:30px;height:15px}
.bird .f1{animation:frame .35s steps(1) infinite}
.bird .f2{animation:frame .35s steps(1) infinite reverse}

/* games */
.gpanel{left:173px;top:447px;width:908px;height:160px;border-radius:0 0 28px 28px;background:var(--panel)}
.card{top:449px;height:112px;background:linear-gradient(#c4c4c6,#b2b2b6);transition:transform .25s,filter .25s}
.card:hover{transform:translateY(-7px) rotate(-1.6deg) scale(1.05);filter:brightness(1.12);z-index:3;box-shadow:0 10px 18px rgba(0,0,0,.35)}
.cart{position:absolute;left:10px;top:4px;width:88px;height:104px;animation:bobsm 4s ease-in-out infinite;animation-delay:calc(var(--n)*-.7s)}
.cart svg{width:100%;height:100%;display:block}
.led{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff7ac0,#b02470 55%,#7a1550);animation:led 1.6s steps(1) infinite}
.led.a{left:112px;top:8px;width:11px;height:11px}
.led.b{left:119px;top:26px;width:15px;height:15px;animation-delay:-.8s}
.card:hover .led{animation-duration:.4s}
.cross{position:absolute;left:111px;top:78px;width:26px;height:26px;transition:transform .15s}
.cross::before,.cross::after{content:"";position:absolute;background:#1b1b1f;border-radius:2px}
.cross::before{left:9px;top:0;width:8px;height:26px}
.cross::after{left:0;top:9px;width:26px;height:8px}
.card:hover .cross{animation:press .5s ease-in-out infinite}
.gbuy{position:absolute;top:570px;height:38px;border:0;border-radius:22px;background:var(--buy);color:var(--ink);font-family:var(--f-ui);font-weight:600;font-size:22px;letter-spacing:1px;overflow:hidden;transition:transform .18s,background .18s,color .18s,box-shadow .18s}
.gbuy::after{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg)}
.gbuy:hover{transform:translateY(-3px) rotate(2deg) scale(1.07);background:var(--neon);color:#fff;box-shadow:0 0 18px var(--neon)}
.gbuy:hover::after{animation:sheen .6s ease-out}
.gbuy:active{transform:scale(.92)}

/* icon bar */
.ico{top:651px;width:34px;height:34px;display:flex;align-items:flex-end;justify-content:center;animation:hop 1.8s ease-in-out infinite;animation-delay:calc(var(--i)*-.09s);transition:transform .15s;cursor:pointer}
.ico:hover{animation:spinicon .6s ease-in-out}
.ico svg{display:block}
.ico.heart svg{animation:beat 1.1s ease-in-out infinite}
.ico.coin svg{animation:coinspin 1.6s linear infinite}
.ico.star svg,.ico.gem svg{animation:twinkle2 1.6s ease-in-out infinite}
.ico.torch svg{animation:flick .3s steps(2) infinite}
.ico.slime svg{transform-origin:50% 100%;animation:squish 1.4s ease-in-out infinite}
.ico.siren svg{animation:siren .7s steps(2) infinite}

/* particles */
.spark{position:absolute;width:7px;height:7px;pointer-events:none;z-index:50;animation:spark .8s ease-out forwards}
.plus1{position:absolute;pointer-events:none;z-index:50;font-family:var(--f-title);font-weight:700;font-size:18px;color:#ffe45a;text-shadow:2px 2px 0 #7a1550;animation:floatup 1s ease-out forwards}

@keyframes glowpulse{0%,100%{opacity:.8}50%{opacity:1}}
@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes jump{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-12px) scale(1.18)}}
@keyframes pillglow{0%,100%{box-shadow:0 0 0 rgba(255,79,192,0)}50%{box-shadow:0 0 16px rgba(255,79,192,.75)}}
@keyframes sheen{from{left:-70%}to{left:130%}}
@keyframes bulb{0%,45%{opacity:1;filter:brightness(1.25)}55%,100%{opacity:.3;filter:brightness(.7);box-shadow:0 0 2px 0 var(--c)}}
@keyframes labelglow{0%,100%{text-shadow:0 0 0 rgba(255,79,192,0)}50%{text-shadow:0 0 12px rgba(255,79,192,.95),0 0 4px #fff}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes bobsm{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes spin{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.15)}100%{transform:rotate(360deg) scale(1.08)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18) rotate(-3deg)}100%{transform:scale(1)}}
@keyframes wig{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes drift{from{transform:translateX(-12px)}to{transform:translateX(14px)}}
@keyframes walk{0%{transform:translateX(0) scaleX(1)}49%{transform:translateX(850px) scaleX(1)}50%{transform:translateX(850px) scaleX(-1)}99%{transform:translateX(0) scaleX(-1)}100%{transform:translateX(0) scaleX(1)}}
@keyframes frame{0%{opacity:1}50%{opacity:0}}
@keyframes fly{0%{transform:translate(0,0)}25%{transform:translate(340px,16px)}50%{transform:translate(680px,-6px)}75%{transform:translate(1010px,14px)}100%{transform:translate(1400px,0)}}
@keyframes led{0%{opacity:1}50%{opacity:.3}}
@keyframes press{0%,100%{transform:scale(1)}50%{transform:scale(.8)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes spinicon{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.5)}100%{transform:rotate(360deg) scale(1)}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.15)}}
@keyframes coinspin{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.15)}}
@keyframes twinkle2{0%,100%{filter:brightness(1)}50%{filter:brightness(1.7) drop-shadow(0 0 4px #fff)}}
@keyframes flick{0%{opacity:1}100%{opacity:.7}}
@keyframes squish{0%,100%{transform:scale(1,1)}50%{transform:scale(1.12,.86)}}
@keyframes siren{0%{filter:brightness(1.4)}100%{filter:brightness(.7)}}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.9}}
@keyframes shoot{0%{opacity:0;transform:translate(0,0) rotate(25deg)}2%{opacity:1}12%{opacity:0;transform:translate(420px,200px) rotate(25deg)}100%{opacity:0}}
@keyframes spark{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
@keyframes floatup{from{transform:translateY(0);opacity:1}to{transform:translateY(-40px);opacity:0}}

@media (prefers-reduced-motion:reduce){
  .stage *,.stage *::before,.stage *::after{animation:none!important}
}
</style>

<div class="fit" id="fit">
  <div class="stage" id="stage">
    <div class="abs scene">
      <div class="abs sky" id="sky"></div>
      <div class="abs glow"></div>
      <canvas class="abs" id="floor" width="2600" height="540"></canvas>
      <div class="abs horizon"></div>
    </div>
    <div class="abs strip l"></div>
    <div class="abs strip r"></div>
    <div class="abs shoot"></div>

    <div class="abs titlebox"><h1 class="title" id="title" aria-label="Video Retro">VIDEO RETRO</h1></div>
    <button class="abs pill" id="login" type="button"><span>iniciar sesión</span></button>
    <button class="abs pill" id="signup" type="button"><span>registrarse</span></button>

    <div class="abs lights" id="lights" aria-hidden="true">
      <svg width="740" height="44" viewBox="0 0 740 44" style="position:absolute;left:0;top:0" id="wire"></svg>
    </div>

    <div class="abs label" id="lbl-con">CONSOLAS</div>
    <div class="abs cpanel"></div>
    <div id="cons"></div>

    <div class="abs label" id="lbl-jue">JUEGOS</div>
    <div id="scenery"></div>
    <div class="abs grass"></div>
    <div class="abs dirt"></div>
    <div class="abs gpanel"></div>
    <div id="games"></div>

    <div id="bar"></div>
  </div>
</div>

<script>

    heart:{m:["..........",".rrr..rrr.","rwwrrrrrrr","rwrrrrrrrr","rrrrrrrrrr",".rrrrrrrr.","..rrrrrr..","...rrrr...","....rr....",".........."],p:{r:'#e8202a',w:'#ffb0b0'}},
    dpad:{m:["..gggggg..",".gwwwwwwg.","gwwwkkwwwg","gwwwkkwwwg","gwkkkkkkwg","gwkkkkkkwg","gwwwkkwwwg","gwwwkkwwwg",".gwwwwwwg.","..gggggg.."],p:{g:'#8a8a96',w:'#e8e8f0',k:'#3a3a48'}},
    floppy:{m:["bbbbbbbbd.","bwwwwwwbbd","bwwwwwwbbd","bbbbbbbbbb","bbbbbbbbbb","bbkkkkkkbb","bbkwwwwkbb","bbkwwwwkbb","bbkkkkkkbb","bbbbbbbbbb"],p:{b:'#8ea8ff',d:'#5a70c8',w:'#ffffff',k:'#2a3060'}},
    disc:{m:["..kkkkkk..",".kbbbbbbk.","kbbcbbbbbk","kbbcccbbbk","kbbccccbbk","kbbccccbbk","kbbcccbbbk","kbbcbbbbbk",".kbbbbbbk.","..kkkkkk.."],p:{k:'#20202a',b:'#3a4a6a',c:'#5fe0ff'}},
    stick:{m:["....ww....","...wwww...","...wwww...","....gg....","....gg....",".gggggggg.","gddddddddg","gddbbbbddg","gddddddddg",".gggggggg."],p:{w:'#e8e8f0',g:'#9a9aa8',d:'#6a6a78',b:'#3a3a48'}},
    bot:{m:["....bb....","....bb....",".bbbbbbbb.","bbwwbbwwbb","bbwkbbwkbb","bbbbbbbbbb","bbkkkkkkbb",".bbbbbbbb.",".bb....bb.",".........."],p:{b:'#b28cff',w:'#ffffff',k:'#2a1a50'}},
    pine:{m:["....gg....","...gggg...","..gGgggg..","...gggg...","..gGgggg..",".gggGgggg.","..gggggg..",".gGgggggg.","....tt....","....tt...."],p:{g:'#2fbf3a',G:'#1a8a2a',t:'#7a4a1a'}},

  function burst(ev,label){
